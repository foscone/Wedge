<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedge — Accesso</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="page">
<div class="page-wrap narrow">
  <header class="page-header">
    <a class="link-btn" href="/">← Progetti</a>
  </header>
  <main class="page-main">
    <h2 id="title">Accesso</h2>
    <p id="hint" class="muted">Inserisci la password di visualizzazione o di modifica per accedere al progetto.</p>
    <form id="form" class="form">
      <label>Password
        <input id="password" type="password" autocomplete="current-password" autofocus>
      </label>
      <button type="submit">Entra</button>
      <div id="err" class="error hidden"></div>
    </form>
  </main>
</div>
<script>
(async () => {
  const slug = decodeURIComponent(location.pathname.split('/')[2] || '');
  if (!slug) { location.href = '/'; return; }
  document.getElementById('title').textContent = 'Accesso · ' + slug;
  // Pick redirect target: ?next= if it's a same-origin path under /p/{slug}.
  function pickTarget() {
    const next = new URLSearchParams(location.search).get('next');
    const fallback = '/p/' + encodeURIComponent(slug);
    if (!next) return fallback;
    if (!next.startsWith('/') || next.includes('://') || next.includes('\\')) return fallback;
    if (!next.includes('/p/' + slug)) return fallback;
    return next;
  }
  try {
    const r = await fetch('/api/session');
    const data = await r.json();
    const proj = (data.projects || []).find(p => p.slug === slug);
    if (proj) document.getElementById('title').textContent = 'Accesso · ' + proj.name;
    const lvl = data.granted && data.granted[slug];
    if (lvl === 'edit' || (lvl === 'view' && !(proj && proj.edit_locked))) {
      location.href = pickTarget();
      return;
    }
    if (lvl === 'view') {
      document.getElementById('hint').innerHTML =
        'Hai già accesso in sola visualizzazione. Inserisci la password di modifica per modificare, ' +
        'oppure <a href="' + pickTarget() + '">continua in sola visualizzazione</a>.';
    }
  } catch (e) {}
  const form = document.getElementById('form');
  const err = document.getElementById('err');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.classList.add('hidden');
    const password = document.getElementById('password').value;
    try {
      const r = await fetch('/api/projects/' + encodeURIComponent(slug) + '/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      if (!r.ok) throw new Error('bad');
      location.href = pickTarget();
    } catch (e2) {
      err.textContent = 'Password errata.';
      err.classList.remove('hidden');
      document.getElementById('password').select();
    }
  });
})();
</script>
</body>
</html>
