services:
  wedge:
    build: .
    container_name: wedge
    ports:
      - "8092:8000"
    env_file:
      - .env
    environment:
      - DATA_DIR=/data
      - THUMBS_DIR=/data/thumbs
    volumes:
      # Percorso host della cartella dati: personalizzabile via .env
      # (DATA_DIR_HOST). Default ./data se non impostato.
      - ${DATA_DIR_HOST:-./data}:/data
      # I bind-mount dei progetti NON vanno qui (cambiano tra locale e
      # produzione). Mettili in docker-compose.override.yml — vedi
      # docker-compose.override.yml.example. Quel file è gitignorato e viene
      # unito automaticamente da `docker compose up`, così non ci sono
      # conflitti tra le diverse macchine.
    restart: unless-stopped
