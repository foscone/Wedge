services:
  wedge:
    build: .
    container_name: wedge
    ports:
      - "8092:8000"
    env_file:
      - .env
    environment:
      - DATA_DIR=/data
      - THUMBS_DIR=/data/thumbs
    volumes:
      - ./data:/data
      # Aggiungi un bind-mount per ogni progetto. Convenzione: monta una
      # cartella host (es. casa-rossi/) sotto /projects/<nome>. La cartella
      # host DEVE contenere due sottocartelle: photos/ e plans/.
      # Esempio:
      # - /percorso/host/casa-rossi:/projects/casa-rossi:ro
      # Poi in /admin di Wedge selezioni "casa-rossi" dal menù a tendina.
    restart: unless-stopped
